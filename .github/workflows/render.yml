name: Render Science Short

on:
  repository_dispatch:
    types: [render_science_short]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r renderer/requirements.txt

      - name: Write n8n payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > payload.json

      - name: Render video
        run: |
          python renderer/render.py payload.json

      - name: Upload rendered Short
        uses: actions/upload-artifact@v4
        with:
          name: science-short-${{ github.event.client_payload.job_id }}
          path: output/
          retention-days: 3
          if-no-files-found: error
